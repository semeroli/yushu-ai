name = "yushu-ai-platform"
pages_build_output_dir = "dist"

# D1 数据库绑定（登录/注册/管理员功能用）
[[d1_databases]]
binding = "DB"
database_name = "yushu-ai"
database_id = "6155c91e-22b0-4a06-8b68-f5d12acac0fa"

# 登录注册与管理员体系已接入：/api/auth/* + 前端门禁（自 commit e8baf2f 起）

# 启用 ReadableStream 构造器：/api/chat 的 SSE 流式代理需要。
# 否则运行时报 "To use the new ReadableStream() constructor, enable the
# streams_enable_constructors compatibility flag"。
compatibility_flags = ["streams_enable_constructors"]

# ================= 博客图片存储（R2）=================
# 博客后台「上传图片」功能依赖此绑定（桶 yushu-blog 已于 2026-10-15 创建）。
# 注意：项目用了本文件管理绑定后，控制台的 Bindings 页面是只读的，
# 新增绑定必须改这里、再重新部署才生效。
# 未配置时，博客文字与「插入图片链接」功能照常可用，仅「上传图片」不可用。
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "yushu-blog"
