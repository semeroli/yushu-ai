<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>语枢AI - 让每一堂语文课充满智慧</title>
  <meta name="description" content="语枢AI，专业的语文教学AI助手。古诗文鉴赏、教案生成、作文批改、阅读理解，让AI赋能语文教育。" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- P1 修复: 防止主题闪烁 FOUC — 在所有 CSS 之前执行 -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('theme') || 'dark';
        document.documentElement.classList.add(theme);
      } catch(e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            paper: '#fafaf9',
            link: '#1c1917',
          },
          fontFamily: {
            serif: ['Noto Serif SC', 'serif'],
          },
        },
      },
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap');
    .serif-zh { font-family: 'Noto Serif SC', serif; }
    .glass { background: rgba(255,255,255,0.7); backdrop-filter: blur(16px); }
    .dark .glass { background: rgba(0,0,0,0.3); }
    .dark .dark\:glass { background: rgba(0,0,0,0.3); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 3px; }
    .dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
